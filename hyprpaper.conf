wallpaper {
    monitor =
    path = /home/ovidiojf/.config/wallpapers/theWallpaper
    # fit_mode = cover
    fit_mode = contain
}

splash = false

# cover: preenche a tela e pode cortar uma parte da imagem.
# contain: mostra a imagem inteira; pode deixar faixas vazias nas laterais ou em cima e embaixo.
# fill: preenche a tela esticando a imagem, o que pode distorcer as proporções.
# tile: repete a imagem em ladrilhos.


